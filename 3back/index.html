    <title>3-back PsychoJS Experiment</title>
    <link rel="stylesheet" href="./lib/psychojs-2025.1.1.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: none;
        text-align: center;
        white-space: pre-wrap;
      }

      #boot-status.error {
        background: #1b0f0f;
        color: #ffd7d7;
        font-family: Consolas, Monaco, monospace;
        text-align: left;
      }

      #root {
        position: relative;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <noscript>이 실험은 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
    <div id="boot-status">Loading PsychoJS experiment...</div>
    <script>
      function showBootError(message) {
        const target = document.getElementById("boot-status");
        if (!target) return;
        target.style.display = "grid";
        target.className = "error";
        target.textContent = message;
      }

      const root = document.getElementById("root");
      const bootStatus = document.getElementById("boot-status");
      if (root && bootStatus) {
        new MutationObserver(() => {
          if (!bootStatus.classList.contains("error") && root.childElementCount > 0) {
            bootStatus.style.display = "none";
          }
        }).observe(root, { childList: true });
      }

      window.addEventListener("error", (event) => {
        showBootError(
          "PsychoJS runtime error:\n" +
            (event.message || "Unknown error") +
            "\n" +
            (event.filename || "") +
            (event.lineno ? ":" + event.lineno : "") +
            (event.colno ? ":" + event.colno : "")
        );
      });

      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        showBootError(
          "PsychoJS promise error:\n" +
            (reason && (reason.stack || reason.message) ? reason.stack || reason.message : String(reason))
        );
      });
    </script>
